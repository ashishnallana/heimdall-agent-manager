appId: works.earendil.heimdall
productName: Heimdall
directories:
  output: desktop-dist
  buildResources: build
files:
  - dist/**
  - electron-dist/**
  - package.json
extraResources:
  - from: release-assets/bridge
    to: bridge
    filter:
      - '**/*'
asar: true
publish:
  provider: github
  owner: tanmayv
  repo: heimdall-agent-manager
mac:
  target: dmg
  category: public.app-category.developer-tools
  icon: src/ui/electron/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  # The afterSign hook owns notarization so it can retry transient CloudKit
  # ticket stapling without resubmitting the already accepted application.
  notarize: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
win:
  target: nsis
  icon: src/ui/electron/icon.png
  verifyUpdateCodeSignature: true
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
afterSign: scripts/release/notarize-electron.cjs
dmg:
  sign: true
  title: Heimdall ${version}
artifactName: Heimdall-${version}-${arch}.${ext}
