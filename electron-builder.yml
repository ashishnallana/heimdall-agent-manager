appId: works.earendil.heimdall
productName: Ninjy
directories:
  output: desktop-dist
  buildResources: build
files:
  - dist/**
  - electron-dist/**
  - package.json
extraResources:
  - from: release-assets/bridge
    to: bridge
    filter:
      - '**/*'
asar: true
publish:
  provider: github
  owner: tanmayv
  repo: heimdall-agent-manager
mac:
  # dmg for people, zip for electron-updater (it cannot update from a dmg, F14).
  # The App/Bridge/both .pkg is assembled from the signed .app by
  # scripts/release/build-macos-pkg.sh (electron-builder's pkg has no choices).
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  # Icons come from scripts/brand/gen-icons.sh; the icns follows the macOS grid.
  icon: build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  # The afterSign hook owns notarization so it can retry transient CloudKit
  # ticket stapling without resubmitting the already accepted application.
  notarize: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
win:
  target: nsis
  icon: src/ui/electron/icon.ico
  # Public Windows code signing has an ongoing cost. Until the project opts in,
  # releases are unsigned and updater integrity relies on GitHub HTTPS plus the
  # SHA-512 digest in latest.yml.
  verifyUpdateCodeSignature: false
nsis:
  # build/installer.nsh adds the App / Bridge / both page (REQ-ENR-4).
  include: build/installer.nsh
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
linux:
  # F13: Linux desktop app. AppImage self-updates (electron-updater); the deb
  # is updated by reinstalling it. Both ask App / Bridge / both on first run
  # (src/ui/electron/installChoice.cts): neither format can run a per-user
  # setup at install time.
  target:
    - AppImage
    - deb
  category: Development
  icon: src/ui/electron/icon.png
  # No public maintainer address yet; dpkg accepts a bare name.
  maintainer: Ninjy maintainers
  synopsis: Ninjy desktop app and Bridge
deb:
  # electron-builder's default depends, kept in full (libnotify4: Electron
  # notifications). The appindicator library lets the Bridge's tray show up.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
  recommends:
    - libayatana-appindicator3-1
afterSign: scripts/release/notarize-electron.cjs
dmg:
  sign: true
  title: Ninjy ${version}
artifactName: Ninjy-${version}-${arch}.${ext}
