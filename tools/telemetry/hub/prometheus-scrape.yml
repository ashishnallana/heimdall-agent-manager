# Prometheus scrape configuration for a Heimdall hub host.
# Drop-in for a hand-managed prometheus.yml; the NixOS module in
# nixos-telemetry.nix expresses the same thing as `services.prometheus.*`.
#
# Job names are referenced by alerts.yml and the Grafana dashboards:
#   heimdall-hub  -> ham-hub --metrics-addr 127.0.0.1:9464
#   node          -> node_exporter (host CPU/mem/disk/fds)
#   blackbox      -> outside-in HTTPS probe of the public hub URL
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: heimdall-hub
    static_configs:
      - targets: ["127.0.0.1:9464"]

  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]

  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [https_2xx]
    static_configs:
      - targets:
          # The hub returns 401 (not 5xx) for unauthenticated API calls, so the
          # module below accepts 2xx..4xx; what we care about is TLS + nginx + hub up.
          - https://heimdall.mundus.in/api/v1/bridges
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115
