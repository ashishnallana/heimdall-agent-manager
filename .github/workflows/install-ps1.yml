name: install.ps1
on:
  push:
    paths:
      - 'scripts/install.ps1'
      - 'tests/windows/**'
      - '.github/workflows/install-ps1.yml'
  pull_request:
    paths:
      - 'scripts/install.ps1'
      - 'tests/windows/**'
      - '.github/workflows/install-ps1.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: install-ps1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  installer:
    name: Installer (${{ matrix.engine }})
    strategy:
      fail-fast: false
      matrix:
        engine: [powershell, pwsh]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Parse with Windows PowerShell 5.1 and PowerShell 7
        shell: pwsh
        run: |
          foreach ($script in @('scripts/install.ps1')) {
            foreach ($exe in @('powershell.exe', 'pwsh.exe')) {
              $code = '$e = $null; [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path ' + $script + '), [ref]$null, [ref]$e); $e | ForEach-Object { $_.ToString() }; exit $e.Count'
              & $exe -NoProfile -Command $code
              if ($LASTEXITCODE) { throw "$script does not parse under $exe" }
            }
            if (@([IO.File]::ReadAllBytes((Resolve-Path $script)) | Where-Object { $_ -gt 127 }).Count) { throw "$script must be pure ASCII" }
          }
      - name: Lint (PSScriptAnalyzer, errors)
        if: matrix.engine == 'pwsh'
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $issues = @(Invoke-ScriptAnalyzer -Path scripts/install.ps1 -Severity Error)
          $issues | Format-Table -AutoSize | Out-String | Write-Host
          if ($issues.Count) { throw "$($issues.Count) PSScriptAnalyzer error(s)" }
      - name: Hermetic install / enroll / upgrade / uninstall test
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/windows/install_ps1_test.ps1 -Engine ${{ matrix.engine }}
