name: Release local binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version/tag; when empty, patch-bump the latest stable release'
        required: false
        default: ''
        type: string
      publish_release:
        description: 'Create/update the GitHub Release after building artifacts'
        required: true
        default: false
        type: boolean
      draft:
        # Default FALSE: a draft release is invisible to unauthenticated API
        # callers (absent from /releases, not merely excluded from
        # /releases/latest) and its assets are not publicly downloadable, so
        # scripts/install.sh cannot resolve or fetch it. Tick this only to
        # stage a release you intend to publish by hand afterwards.
        description: 'Create the GitHub Release as a draft'
        required: true
        default: false
        type: boolean
      prerelease:
        # Default TRUE: every release starts as a CANDIDATE. Hubs pin release
        # tags (nix-homelab-config docs/heimdall-release-channels.md): the canary
        # hub (mundus) takes a candidate first; "Promote release" then clears this
        # flag and marks it Latest once the stable hub (brolabs) takes the same
        # tag. /releases/latest and scripts/install.sh without --version only
        # ever see promoted releases. Untick to publish straight to stable.
        description: 'Publish as a candidate (prerelease) until promoted'
        required: true
        default: true
        type: boolean
      notes:
        # Hand-written Markdown placed above the generated changelog: what breaks
        # and how to upgrade. Commits marked `type!:` or with a `BREAKING CHANGE:`
        # footer are listed automatically; this is for the prose around them.
        description: 'Optional Markdown shown above the generated changelog (e.g. upgrade notes)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: release-local-binaries-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Commit release version
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      clean_version: ${{ steps.prepare.outputs.clean_version }}
      commit_sha: ${{ steps.prepare.outputs.commit_sha }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and commit release version
        id: prepare
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version || '' }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            version="$GITHUB_REF_NAME"
            clean_version="${version#v}"
            commit_sha="$GITHUB_SHA"
          else
            # Releases may have created tags after the selected branch was
            # last fetched. Refresh them before calculating the next patch.
            git fetch --force --tags origin
            requested="${REQUESTED_VERSION#v}"
            if [ -n "$requested" ]; then
              clean_version="$requested"
            else
              latest_tag=""
              while IFS= read -r candidate; do
                if [[ "$candidate" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                  latest_tag="$candidate"
                  break
                fi
              done < <(git tag --list 'v*' --sort=-v:refname)
              if [ -n "$latest_tag" ]; then
                current="${latest_tag#v}"
              else
                current="$(sed -n 's/.*appVersion = "\([^"]*\)";.*/\1/p' flake.nix | head -n 1)"
              fi
              stable="${current%%-*}"
              IFS=. read -r major minor patch <<< "$stable"
              clean_version="$major.$minor.$((patch + 1))"
            fi

            if ! [[ "$clean_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "invalid release version: $clean_version" >&2
              exit 2
            fi

            version="v$clean_version"
            scripts/release/bump-version.sh --version-only "$clean_version"
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            # Commit the complete durable release before build jobs fetch it.
            git add flake.nix src/contracts/protocol.odin \
              extensions/antigravity/plugin.json \
              extensions/claude-code/.claude-plugin/plugin.json \
              extensions/codex/.codex-plugin/plugin.json \
              extensions/.claude-plugin/marketplace.json \
              extensions/.agents/plugins/marketplace.json \
              src/hub/repository/sqlite/migrations.odin \
              src/hub/repository/sqlite/migrations/
            git commit --allow-empty -m "chore: release $version"
            git push origin "HEAD:$GITHUB_REF_NAME"
            commit_sha="$(git rev-parse HEAD)"
          fi

          {
            echo "version=$version"
            echo "clean_version=$clean_version"
            echo "commit_sha=$commit_sha"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-24.04
            nix_system: x86_64-linux
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            nix_system: aarch64-linux
          # T12 termux-arm64 is TEMPORARILY DISABLED: release-termux-ham-bridge
          # fails to link (musl has no backtrace/backtrace_symbols_fd, used by
          # crashlog.odin). Restore the entry below once that is fixed, along
          # with the other termux-arm64 lines disabled in this file and in
          # promote-release.yml.
          #   - target: termux-arm64
          #     runner: ubuntu-24.04-arm
          #     nix_system: aarch64-linux
          #     odin_attr_prefix: release-termux-
          - target: darwin-amd64
            runner: macos-15-intel
            nix_system: x86_64-darwin
          - target: darwin-arm64
            runner: macos-14
            nix_system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout clean source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check the outbound HTTP boundary (src/lib/httpc only)
        shell: bash
        run: |
          scripts/check-http-boundary.sh
          scripts/check-http-boundary.sh --self-test

      - name: Stamp release version into source and flake
        shell: bash
        run: |
          set -euo pipefail
          raw_version="${{ needs.prepare.outputs.version }}"
          commit_sha="${{ needs.prepare.outputs.commit_sha }}"
          commit_sha="${commit_sha:0:8}"
          scripts/release/bump-version.sh "$raw_version" "$commit_sha"

      - name: Build local binaries from flake
        id: nix-build
        shell: bash
        run: |
          set -euo pipefail
          actual_system="$(nix eval --raw --impure --expr 'builtins.currentSystem')"
          if [ "$actual_system" != "${{ matrix.nix_system }}" ]; then
            echo "runner Nix system mismatch: expected ${{ matrix.nix_system }}, got $actual_system" >&2
            exit 1
          fi
          # matrix.odin_attr_prefix is set in-file (termux-* only), not event data.
          odin="${{ matrix.odin_attr_prefix || 'release-' }}"
          nix build \
            ".#${odin}ham-bridge" \
            ".#${odin}ham-ctl" \
            .#release-ham-pty-host \
            ".#${odin}heimdall" \
            --print-out-paths \
            --no-link | tee "$RUNNER_TEMP/nix-paths.txt"
          paths=()
          while IFS= read -r line; do
            [ -n "$line" ] && paths+=("$line")
          done < "$RUNNER_TEMP/nix-paths.txt"
          if [ "${#paths[@]}" -ne 4 ]; then
            echo "expected four Nix output paths, got ${#paths[@]}" >&2
            exit 1
          fi
          {
            echo "bridge=${paths[0]}"
            echo "ctl=${paths[1]}"
            echo "pty_host=${paths[2]}"
            echo "manager=${paths[3]}"
          } >> "$GITHUB_OUTPUT"

      - name: Package heimdall-local tarball
        shell: bash
        run: |
          set -euo pipefail
          scripts/release/package-local-binary-tarball.sh \
            "${{ matrix.target }}" \
            "${{ needs.prepare.outputs.version }}" \
            dist \
            "${{ steps.nix-build.outputs.bridge }}" \
            "${{ steps.nix-build.outputs.ctl }}" \
            "${{ steps.nix-build.outputs.manager }}" \
            "${{ steps.nix-build.outputs.pty_host }}"
          tar -tzf "dist/heimdall-local-${{ matrix.target }}.tar.gz" | sort | tee "dist/heimdall-local-${{ matrix.target }}.contents.txt"
          case "$(uname -s)" in
            Darwin) shasum -a 256 "dist/heimdall-local-${{ matrix.target }}.tar.gz" > "dist/SHA256SUMS-${{ matrix.target }}.txt" ;;
            *) sha256sum "dist/heimdall-local-${{ matrix.target }}.tar.gz" > "dist/SHA256SUMS-${{ matrix.target }}.txt" ;;
          esac

      - name: Upload target artifact
        uses: actions/upload-artifact@v4
        with:
          name: heimdall-local-${{ matrix.target }}-${{ needs.prepare.outputs.version }}
          path: |
            dist/heimdall-local-${{ matrix.target }}.tar.gz
            dist/heimdall-local-${{ matrix.target }}.contents.txt
            dist/SHA256SUMS-${{ matrix.target }}.txt
          if-no-files-found: error
          retention-days: 30

      # REQ-INST-16: the release tarballs target stock hosts with no /nix/store.
      # Fail the build here if a shipped binary references the store OR cannot
      # execute without it. The packaging script already gates the staged tree;
      # this re-checks the final tarball and adds the execution proof that scan
      # alone cannot give. (matrix.target is defined in-file, not event data.)
      # The Odin binaries (ham-bridge, ham-ctl, heimdall) link the host's glibc
      # and libcurl.so.4 (src/lib/httpc), so they are proven on the runner's own
      # stock userland with the nix profile removed from PATH and no nix library
      # path; ham-pty-host stays fully static and keeps the storeless rootfs proof.
      - name: Verify release binaries are portable (Linux)
        if: ${{ startsWith(matrix.target, 'linux-') || startsWith(matrix.target, 'termux-') }}
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/portable-verify"
          rm -rf "$work"; mkdir -p "$work"
          tar -xzf "dist/heimdall-local-${{ matrix.target }}.tar.gz" -C "$work"
          for f in "$work"/bin/*; do
            case "$(od -A n -t x1 -N 4 "$f" | tr -d ' \n')" in
              7f454c46) ;;
              *) echo "FAIL: $f is not an ELF binary" >&2; exit 1 ;;
            esac
            interp="$(readelf -l "$f" 2>/dev/null | sed -n 's/.*Requesting program interpreter: \(.*\)].*/\1/p' || true)"
            case "$(basename "$f"):$interp" in
              ham-pty-host:) ;;
              ham-pty-host:*)
                echo "FAIL: $f has a program interpreter ($interp); ham-pty-host must be fully static" >&2
                exit 1 ;;
              *:/lib64/ld-linux-x86-64.so.2|*:/lib/ld-linux-aarch64.so.1|*:) ;;
              *)
                echo "FAIL: $f has program interpreter $interp; release binaries must use the FHS loader" >&2
                exit 1 ;;
            esac
            if readelf -d "$f" 2>/dev/null | grep -q '/nix/store'; then
              echo "FAIL: $f references /nix/store in its dynamic section" >&2
              exit 1
            fi
          done
          # The execution half. scripts/release/storeless-exec.sh picks a clean
          # environment by PROVING it can run a static control and reject a
          # dynamic one, and exits non-zero rather than skipping when it can
          # prove neither -- so this step cannot pass without executing.
          echo "storeless mechanism: $(scripts/release/storeless-exec.sh select)"
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcurl4t64 || sudo apt-get install -y -qq libcurl4
          for b in ham-bridge ham-ctl heimdall; do
            echo "--- $b --version (host glibc + libcurl, no nix) ---"
            if ldd "$work/bin/$b" | grep -q '/nix/store'; then
              echo "FAIL: $b resolves a library from /nix/store" >&2; exit 1
            fi
            ldd "$work/bin/$b"
            out="$(env -i PATH=/usr/bin:/bin "$work/bin/$b" --version)" || {
              echo "FAIL: $b could not execute on the stock host userland" >&2; exit 1; }
            [ -n "$out" ] || { echo "FAIL: $b --version printed nothing" >&2; exit 1; }
            echo "$out"
          done
          echo "--- ham-pty-host --help (storeless) ---"
          out="$(scripts/release/storeless-exec.sh run "$work/bin/ham-pty-host" --help)" || {
            echo "FAIL: ham-pty-host could not execute without /nix/store" >&2; exit 1; }
          [ -n "$out" ] || { echo "FAIL: ham-pty-host --help printed nothing storeless" >&2; exit 1; }
          echo "$out" | head -3

      # T12: the termux bundle must start under Android's app seccomp policy.
      # scripts/release/android-seccomp-probe.sh straces --version/--help and
      # fails on any syscall that policy kills (the list and its AOSP sources
      # are in the script). The negative control comes FIRST: the glibc-static
      # linux-arm64 ham-bridge -- the exact binary SIGSYS-killed on a real
      # Android 15 device -- must be rejected for set_robust_list, or the probe
      # is proving nothing and the step fails.
      - name: Verify Termux binaries pass the Android seccomp probe
        if: ${{ startsWith(matrix.target, 'termux-') }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq strace
          control="$(nix build .#release-ham-bridge --print-out-paths --no-link)/bin/ham-bridge"
          scripts/release/android-seccomp-probe.sh control "$control"
          work="$RUNNER_TEMP/seccomp-probe"
          rm -rf "$work"; mkdir -p "$work"
          tar -xzf "dist/heimdall-local-${{ matrix.target }}.tar.gz" -C "$work"
          scripts/release/android-seccomp-probe.sh check \
            "$work/bin/ham-bridge" "$work/bin/ham-ctl" "$work/bin/heimdall" "$work/bin/ham-pty-host"
          # T17: --version never accepts a connection; run the bridge as a service
          # and connect to its listeners so accept(2) vs accept4(2) is actually
          # exercised (SIGSYS __NR_accept on a real device, v0.3.32).
          scripts/release/android-seccomp-probe.sh serve "$work/bin/ham-bridge"

      - name: Verify release binaries are portable (macOS)
        if: ${{ startsWith(matrix.target, 'darwin-') }}
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/portable-verify"
          rm -rf "$work"; mkdir -p "$work"
          tar -xzf "dist/heimdall-local-${{ matrix.target }}.tar.gz" -C "$work"
          for f in "$work"/bin/*; do
            if otool -L "$f" | grep -q '/nix/store'; then
              echo "FAIL: $f links a nix-store dylib" >&2
              exit 1
            fi
            if otool -l "$f" | grep -A2 LC_RPATH | grep -q '/nix/store'; then
              echo "FAIL: $f has an rpath under /nix/store" >&2
              exit 1
            fi
          done
          # The macOS runner has no nix store before our Nix install step puts
          # one there; the scan above is what proves these binaries never
          # touch it. Execution proves they load and run on a stock host.
          "$work/bin/ham-bridge" --version
          "$work/bin/ham-ctl" --version
          "$work/bin/heimdall" --version
          "$work/bin/ham-pty-host" --help >/dev/null

  # windows-amd64: hub-less Odin ham-bridge/ham-ctl (static sqlite3.lib from the
  # pinned amalgamation, FTS5) and a static-CRT Rust ham-pty-host, packaged as
  # heimdall-local-windows-amd64.zip for scripts/install.ps1. A zip, not a
  # tarball: install.ps1 reads it with .NET (exact entry names and types, no
  # extraction by name) and the bridge's self-update `tar -xzf` (Windows bsdtar)
  # reads zip too. No heimdall.exe (the manager is systemd/launchd-only).
  build-windows:
    name: Build windows-amd64
    needs: prepare
    runs-on: windows-2022
    env:
      ODIN_TAG: dev-2026-09
      ODIN_ZIP_SHA256: 8ed8abd95b82e0af1eb7e86cb75f380fd8bde104947721817b35929f5fc19388
      RUST_TOOLCHAIN: 1.99.1
    steps:
      - name: Checkout clean source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: MSVC developer environment (cl, lib, link, dumpbin)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Stamp release version into source and flake
        shell: bash
        run: |
          set -euo pipefail
          commit_sha="${{ needs.prepare.outputs.commit_sha }}"
          scripts/release/bump-version.sh "${{ needs.prepare.outputs.version }}" "${commit_sha:0:8}"

      - name: Install Odin (pinned, SHA-256 verified)
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'odin.zip'
          Invoke-WebRequest "https://github.com/odin-lang/Odin/releases/download/$env:ODIN_TAG/odin-windows-amd64-$env:ODIN_TAG.zip" -OutFile $zip
          $got = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($got -ne $env:ODIN_ZIP_SHA256) { throw "Odin zip SHA-256 mismatch: $got" }
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'odin')
          $odin = Join-Path $env:RUNNER_TEMP 'odin\dist\odin.exe'
          & $odin version
          "ODIN=$odin" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Build Windows binaries
        shell: pwsh
        run: |
          rustup toolchain install "$env:RUST_TOOLCHAIN" --profile minimal
          rustup default "$env:RUST_TOOLCHAIN"
          rustc --version
          scripts/windows/build.ps1 -OutDir dist/windows-bin -Odin $env:ODIN -Version "${{ needs.prepare.outputs.version }}"

      - name: Verify Windows binaries are self-contained and run
        shell: pwsh
        run: |
          foreach ($exe in Get-ChildItem dist/windows-bin -Filter *.exe) {
            $deps = (& dumpbin /nologo /dependents $exe.FullName) -join "`n"
            if ($deps -match '(?i)(vcruntime|msvcp)[0-9]*\.dll|sqlite3\.dll|libcurl[-0-9a-z]*\.dll') { throw "$($exe.Name) needs a non-system DLL:`n$deps" }
          }
          & dist/windows-bin/ham-bridge.exe --version; if ($LASTEXITCODE) { throw 'ham-bridge --version failed' }
          & dist/windows-bin/ham-bridge.exe --help; if ($LASTEXITCODE) { throw 'ham-bridge --help failed' }
          & dist/windows-bin/ham-ctl.exe --version; if ($LASTEXITCODE) { throw 'ham-ctl --version failed' }
          & dist/windows-bin/ham-pty-host.exe --help | Select-Object -First 3; if ($LASTEXITCODE) { throw 'ham-pty-host --help failed' }

      - name: Package heimdall-local zip
        shell: pwsh
        run: |
          scripts/release/package-windows-bundle.ps1 -BinDir dist/windows-bin -Version "${{ needs.prepare.outputs.version }}" -OutDir dist
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [IO.Compression.ZipFile]::OpenRead((Resolve-Path dist/heimdall-local-windows-amd64.zip))
          ($z.Entries | ForEach-Object FullName | Sort-Object) | Set-Content -Encoding ascii dist/heimdall-local-windows-amd64.contents.txt
          $z.Dispose()
          Get-Content dist/heimdall-local-windows-amd64.contents.txt
          $h = (Get-FileHash -Algorithm SHA256 dist/heimdall-local-windows-amd64.zip).Hash.ToLowerInvariant()
          "$h  dist/heimdall-local-windows-amd64.zip" | Set-Content -Encoding ascii dist/SHA256SUMS-windows-amd64.txt

      - name: Smoke-test the packaged bundle
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'win-verify'
          Expand-Archive dist/heimdall-local-windows-amd64.zip -DestinationPath $work
          & "$work/bin/ham-bridge.exe" --version; if ($LASTEXITCODE) { throw 'packaged ham-bridge --version failed' }
          & "$work/bin/ham-bridge.exe" --help | Out-Null; if ($LASTEXITCODE) { throw 'packaged ham-bridge --help failed' }

      - name: Upload target artifact
        uses: actions/upload-artifact@v4
        with:
          name: heimdall-local-windows-amd64-${{ needs.prepare.outputs.version }}
          path: |
            dist/heimdall-local-windows-amd64.zip
            dist/heimdall-local-windows-amd64.contents.txt
            dist/SHA256SUMS-windows-amd64.txt
          if-no-files-found: error
          retention-days: 30

  verify-storeless:
    name: Execute release binaries without Nix (${{ matrix.target }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          # termux-arm64 temporarily disabled (see the build matrix).
          - target: darwin-amd64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Execute target tarball on a storeless host
        shell: bash
        run: |
          set -euo pipefail
          if [ -e /nix/store ]; then
            echo "FAIL: this job must run without a Nix store" >&2
            exit 1
          fi
          # The Odin binaries link the host libcurl (src/lib/httpc).
          if [ "$(uname -s)" = Linux ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq libcurl4t64 || sudo apt-get install -y -qq libcurl4
          fi
          work="$RUNNER_TEMP/storeless-verify"
          rm -rf "$work"
          mkdir -p "$work"
          tar -xzf "dist/heimdall-local-${{ matrix.target }}.tar.gz" -C "$work"
          "$work/bin/ham-bridge" --version
          "$work/bin/ham-ctl" --version
          "$work/bin/heimdall" --version
          "$work/bin/ham-pty-host" --help >/dev/null

  release:
    name: Publish GitHub Release
    needs: [prepare, build, build-windows, verify-storeless]
    runs-on: ubuntu-24.04
    if: ${{ github.ref_type == 'tag' || inputs.publish_release == true }}
    permissions:
      contents: write
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
          # Full history and tags: the changelog walks back to the previous release tag.
          fetch-depth: 0
          persist-credentials: false

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify tarballs and create SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          version="${{ needs.prepare.outputs.version }}"
          expected=(
            heimdall-local-darwin-arm64.tar.gz
            heimdall-local-darwin-amd64.tar.gz
            heimdall-local-linux-amd64.tar.gz
            heimdall-local-linux-arm64.tar.gz
            # heimdall-local-termux-arm64.tar.gz  (temporarily disabled)
          )
          versioned=()
          for tarball in "${expected[@]}"; do
            test -f "$tarball"
            # List once; piping tar into `grep -q` races under pipefail
            # (grep exits on first match -> tar hits EPIPE -> false failure).
            tar -tzf "$tarball" > "$RUNNER_TEMP/$tarball.entries"
            grep -Fxq bin/ham-bridge "$RUNNER_TEMP/$tarball.entries"
            grep -Fxq bin/ham-ctl "$RUNNER_TEMP/$tarball.entries"
            grep -Fxq bin/heimdall "$RUNNER_TEMP/$tarball.entries"
            grep -Fxq bin/ham-pty-host "$RUNNER_TEMP/$tarball.entries"
            grep -Fxq scripts/apply-bridge-update.sh "$RUNNER_TEMP/$tarball.entries"
            grep -Fxq README.md "$RUNNER_TEMP/$tarball.entries"
            grep -Fxq LICENSE "$RUNNER_TEMP/$tarball.entries"
            target="${tarball#heimdall-local-}"
            target="${target%.tar.gz}"
            asset="heimdall-local-${target}-${version}.tar.gz"
            cp "$tarball" "$asset"
            versioned+=("$asset")
          done
          # windows-amd64 ships a zip (scripts/install.ps1); no heimdall.exe.
          zip=heimdall-local-windows-amd64.zip
          test -f "$zip"
          unzip -Z1 "$zip" > "$RUNNER_TEMP/$zip.entries"
          for entry in bin/ham-bridge.exe bin/ham-ctl.exe bin/ham-pty-host.exe README.md LICENSE METADATA.json; do
            grep -Fxq "$entry" "$RUNNER_TEMP/$zip.entries"
          done
          # install.ps1 refuses absolute, drive-qualified, ".." and backslash names.
          if grep -Eq '(^/|^[A-Za-z]:|(^|/)\.\.(/|$)|\\)' "$RUNNER_TEMP/$zip.entries"; then
            echo "unsafe entry name in $zip" >&2; exit 1
          fi
          cp "$zip" "heimdall-local-windows-amd64-${version}.zip"
          versioned+=("heimdall-local-windows-amd64-${version}.zip")
          sha256sum "${versioned[@]}" > SHA256SUMS

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit_sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
          # Via env, never inlined into the script: it is free-form user text.
          EXTRA_NOTES: ${{ inputs.notes || '' }}
        shell: bash
        run: |
          set -euo pipefail
          notes_file="$RUNNER_TEMP/release-notes.md"
          : > "$notes_file"
          if [ -n "$EXTRA_NOTES" ]; then
            printf '%s\n\n' "$EXTRA_NOTES" >> "$notes_file"
          fi
          scripts/release/changelog.sh "$VERSION" "$RELEASE_COMMIT" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" >> "$notes_file"
          cat >> "$notes_file" <<NOTES

          ## Downloads

          Heimdall local Bridge/wrapper/CLI binaries for $VERSION.

          Artifacts:
          - heimdall-local-darwin-arm64-$VERSION.tar.gz
          - heimdall-local-darwin-amd64-$VERSION.tar.gz
          - heimdall-local-linux-amd64-$VERSION.tar.gz
          - heimdall-local-linux-arm64-$VERSION.tar.gz
          - heimdall-local-windows-amd64-$VERSION.zip (scripts/install.ps1)
          - SHA256SUMS
          NOTES
          release_flags=()
          if [ "${{ inputs.draft || false }}" = "true" ]; then release_flags+=(--draft); fi
          # Tag pushes have no inputs; they are candidates too (see the prerelease input).
          if [ "${{ github.event_name == 'push' || inputs.prerelease }}" = "true" ]; then
            release_flags+=(--prerelease)
          fi
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/heimdall-local-*-"$VERSION".tar.gz dist/heimdall-local-*-"$VERSION".zip dist/SHA256SUMS --clobber
            gh release edit "$VERSION" --notes-file "$notes_file"
          else
            gh release create "$VERSION" dist/heimdall-local-*-"$VERSION".tar.gz dist/heimdall-local-*-"$VERSION".zip dist/SHA256SUMS \
              --title "$VERSION" \
              --target "$RELEASE_COMMIT" \
              --notes-file "$notes_file" \
              "${release_flags[@]}"
          fi
