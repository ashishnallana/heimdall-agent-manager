name: Promote release

# Promotes a CANDIDATE (prerelease) to the stable channel: clears the prerelease
# flag and marks it Latest. No rebuild - the stable hub gets byte-identical
# binaries to the ones the canary hub soaked. Run this when the stable hub
# (brolabs) is pinned to the tag; see nix-homelab-config
# docs/heimdall-release-channels.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to promote, e.g. v0.3.46'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: promote-release
  cancel-in-progress: false

jobs:
  promote:
    name: Promote ${{ inputs.version }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify the release is a complete candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "invalid release tag: $VERSION" >&2; exit 2; }
          gh release view "$VERSION" --json isDraft,isPrerelease,assets > release.json
          if [ "$(jq -r .isDraft release.json)" = "true" ]; then
            echo "$VERSION is a draft; publish it before promoting" >&2; exit 1
          fi
          if [ "$(jq -r .isPrerelease release.json)" != "true" ]; then
            echo "$VERSION is already promoted; nothing to do"
          fi
          # Same bundle set the release job requires (keep in sync with
          # release-local-binaries.yml "Verify tarballs and create SHA256SUMS").
          missing=0
          # termux-arm64 temporarily disabled (see release-local-binaries.yml build matrix).
          for target in darwin-arm64 linux-amd64 linux-arm64; do
            name="heimdall-local-$target-$VERSION.tar.gz"
            jq -e --arg n "$name" '.assets | any(.name == $n)' release.json >/dev/null || {
              echo "missing asset: $name" >&2; missing=1; }
          done
          # Intel macOS is opt-in. Windows was absent from older candidates.
          # Either optional asset must agree with the published checksum manifest:
          # listed-but-missing and present-but-unlisted both fail promotion.
          gh release download "$VERSION" --pattern SHA256SUMS --output sums.txt --clobber
          for name in "heimdall-local-darwin-amd64-$VERSION.tar.gz" "heimdall-local-windows-amd64-$VERSION.zip"; do
            listed=0
            awk -v n="$name" '{ sub(/^\*/, "", $2) } $2 == n { found = 1 } END { exit !found }' sums.txt && listed=1
            present=0
            jq -e --arg n "$name" '.assets | any(.name == $n)' release.json >/dev/null && present=1
            if [ "$listed" = 1 ] && [ "$present" = 0 ]; then
              echo "missing asset: $name (listed in SHA256SUMS)" >&2; missing=1
            elif [ "$listed" = 0 ] && [ "$present" = 1 ]; then
              echo "asset $name has no SHA256SUMS line" >&2; missing=1
            fi
          done
          jq -e '.assets | any(.name == "SHA256SUMS")' release.json >/dev/null || {
            echo "missing asset: SHA256SUMS" >&2; missing=1; }
          [ "$missing" = 0 ]
          mkdir -p desktop-candidate
          gh release download "$VERSION" --dir desktop-candidate \
            --pattern latest.yml --pattern latest-mac.yml \
            --pattern 'Ninjy-*.zip' --pattern 'Ninjy-*.zip.blockmap' \
            --pattern 'Ninjy-*.exe' --pattern 'Ninjy-*.exe.blockmap'
          python3 scripts/release/validate-desktop-updates.py desktop-candidate \
            --version "${VERSION#v}" --platform mac --arch arm64 --assets release.json
          python3 scripts/release/validate-desktop-updates.py desktop-candidate \
            --version "${VERSION#v}" --platform windows --arch x64 --assets release.json

      - name: Mark as the stable Latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$VERSION" --prerelease=false --latest
          gh release view "$VERSION" --json tagName,isPrerelease,url
