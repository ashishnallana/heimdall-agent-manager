<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      DEV-ONLY composer demo (REQ-DEMO-1..5). Vite serves extra root HTML files in dev, but

      transcript with no network, vault or auth. Entry: src/ui/dev/composerDemo.tsx.
    -->

    <meta name="robots" content="noindex" />
    <title>Composer demo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/ui/dev/composerDemo.tsx"></script>
  </body>
</html>
